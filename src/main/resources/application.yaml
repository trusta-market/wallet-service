spring:
  application:
    name: wallet-service

  profiles:
    active: ${PROFILE}
  
  jpa:
    properties:
      hibernate:
        default_schema: p_wallet
        
trusta:
  security:
    trust-gateway-headers: true

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
