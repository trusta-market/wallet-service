# K8s 환경 전용 override (SPRING_PROFILES_ACTIVE=k8s 일 때만 로드).

server:
  port: 8302
  # Tomcat — 부하 테스트 결과로 default threads.max=200 이 단일 pod 의 동시 처리 한계.
  # 800 으로 증액 (stack ~800MB, memory limit 2Gi 안). accept-count 도 같이 늘려서 queue 더 받음.
  tomcat:
    threads:
      max: 800
    accept-count: 300
    max-connections: 20000

spring:
  config:
    import: "optional:configserver:http://config-server"
  cloud:
    config:
      uri: http://config-server
      label: develop
      fail-fast: false
      # application.yaml 의 discovery.enabled:true 를 K8s 에선 비활성 (Service DNS 직접 사용)
      discovery:
        enabled: false
  datasource:
    # DB_HOST env 로 endpoint 주입 (Secret domain-postgres-secrets). default = postgres (in-cluster fallback).
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/trusta_market
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # HikariCP pool — default 10 이 thread 800 대비 너무 작아서 thread 가 pool 대기.
    # postgres max_connections=700 안에서 7 DB service × pool 18 × HPA max 5 = 630 (안전선).
    hikari:
      maximum-pool-size: 18
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: p_wallet
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  # Redis — K8s 환경 미사용. RedisAutoConfiguration 비활성 (캐싱 코드 있어도 startup OK).
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  # Kafka — GKE namespace 'kafka' 의 StatefulSet 3 broker.
  # listener.ack-mode: manual — PointSettlementListener 가 Acknowledgment 파라미터 받음.
  kafka:
    bootstrap-servers: kafka.kafka:9092
    listener:
      ack-mode: manual
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    
# common 의 LoginFilter 가 gateway 의 X-User-* 헤더 → SecurityContext 로 주입.
# false (default) 면 LoginFilter 가 전체 skip → SecurityContext 미설정 →
# /internal/** 등 인증 필요한 path 가 401 반환. wallet → payment Feign 호출이 깨짐.
trusta:
  security:
    trust-gateway-headers: true